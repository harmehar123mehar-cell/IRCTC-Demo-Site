    <main>
        <img src="https://www.irctc.co.in/nget/assets/images/secondry-logo.png" alt="Indian Railway Logo" class="logos">

        <img src="https://www.irctc.co.in/nget/assets/images/logo.png" alt="IRCTC Logo" class="logos">
    

        <div class="fa-details">
            <h2>Check the fare details here:</h2>

            <form class="fa-train-details">

                <label for="fa-train-number">Enter Train Number:
                    <input required type="text" name="fa-train-number" id="fa-train-number" placeholder="eg:12951" required>
                </label>

                <label for="fa-journey-date">Enter Journey Date:
                    <input required type="date" name="fa-journey-date" id="fa-journey-date" placeholder="2026-07-23" required>
                </label>

                <label for="fa-source-station">Enter Source Station:
                    <input required type="text" name="fa-source-station" id="fa-source-station" placeholder="eg: NDLS " required>
                </label>

                <label for="fa-destination-station">Enter Destination Station:
                    <input required type="text" name="fa-destination-station" id="fa-destination-station" placeholder="eg: MMCT " required>
                </label>

                <label for="fa-train-class" >Enter Class:
                    <select id="fa-train-class" name="fa-train-class" >
                        <option value="all-classes">All Classes</option>
                        <option value="sleeper">Sleeper</option>
                        <option value="3ac">3 AC</option>
                        <option value="2ac">2 AC</option>
                        <option value="1ac">1 AC</option>
                    </select>
                </label>

                <label for="fa-train-quota" >Enter Quota:
                    <select id="fa-train-quota" name="fa-train-quota">
                        <option value="general">General</option>
                        <option value="ladies">Ladies</option>
                        <option value="sr-citizen">Lower Berth/Sr.Citizen</option>
                        <option value="duty-pass">Duty Pass</option>
                        <option value="tatkal">Tatakl</option>
                        <option value="prem-tatkal">Premium Tatakl</option>
                    </select>
                </label>

                <label for="fa-passenger-type" >Passenger Type:
                    <select id="fa-passenger-type" name="fa-passenger-type" required>
                        <option value="adult">Adult</option>
                        <option value="child">Child</option>
                    </select>
                </label>
            </form>
            <button type="submit" id="fa-check-avail" class="fa-check-avail" disabled>Check Fare</button>
            <button type="reset" id="fa-reset" name="fa-reset">Reset</button>
        </div>
          <script src="config.js"></script>
